# CI: build and test RTTI on MSVC, GCC and Clang, plus an ASan/UBSan job, a
# mixed-toolchain link job and a Release benchmark job.
#
# Every test job is a real configure -> build -> ctest pipeline; the test
# targets (rtti_tests, rtti_proto_extension_tests, rtti_flat_schema_tests) are
# registered via enable_testing() + add_test (CMakeLists.txt,
# tests/CMakeLists.txt), so `ctest --output-on-failure` is the single gate
# across platforms.
#
# Visibility: after the ctest gate each test executable is additionally run
# directly, so its per-case `[TEST] ...` / `[CASE] ...` lines and the trailing
# `NNNNN assertions, 0 failures` summary show up in the job log; the same
# counts (per program and per case) are appended to the run's GitHub step
# summary and the raw logs are uploaded as artifacts. The `benchmarks` job
# builds the Release microbenchmarks with MSVC (same toolchain family and the
# same iteration parameters as the recorded local captures in
# docs/benchmarks/) and records their ns/op and MB/s tables in the step
# summary + an artifact. The CI runner CPU differs, so benchmark numbers are
# data points to compare in shape, not authoritative baselines.
name: CI

# `on` as a mapping key is YAML 1.2-safe and is what GitHub Actions expects;
# the flow-sequence form avoids any YAML 1.1 `on` -> boolean misparse.
on: [push, pull_request]

jobs:
  windows-msvc:
    runs-on: windows-latest
    strategy:
      matrix:
        cfg: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC x64)
        # windows-latest now ships Visual Studio 2026 only (VS2022 removed
        # 2026-06; see actions/runner-images#14017), so no fixed
        # "-G Visual Studio 17 2022". CMake auto-detects the newest installed
        # Visual Studio; -A x64 pins the architecture.
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config ${{ matrix.cfg }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.cfg }} --output-on-failure
      - name: Test detail (per-case output + step summary)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-logs | Out-Null
          $rows = @()
          $cases = @()
          $caseCount = 0
          foreach ($exe in @('rtti_proto_extension_tests', 'rtti_flat_schema_tests', 'rtti_tests')) {
            $path = "build/tests/${{ matrix.cfg }}/$exe.exe"
            Write-Host "================ $path ================"
            $out = & $path 2>&1
            $rc = $LASTEXITCODE
            $out | Write-Host
            $out | Out-File -FilePath "test-logs/$exe.log" -Encoding utf8
            $m = [regex]::Matches(($out | Out-String), '(\d+) assertions, (\d+) failures')
            if ($m.Count -gt 0) {
              $a = $m[$m.Count - 1].Groups[1].Value
              $f = $m[$m.Count - 1].Groups[2].Value
            } else {
              $a = 'n/a'
              $f = 'n/a'
            }
            $res = if ($rc -eq 0) { 'OK' } else { "exit $rc" }
            $rows += "| $exe | $a | $f | $res |"
            $crows = @()
            foreach ($line in $out) {
              if ($line -match '^\[CASE\] (.+): (\d+) assertions, (\d+) failures$') {
                $crows += "| $($Matches[1]) | $($Matches[2]) | $($Matches[3]) |"
              }
            }
            $caseCount += $crows.Count
            $cases += @("#### $exe", "", "| case | assertions | failures |", "| --- | --- | --- |") + $crows + @("")
          }
          $head = (Get-Content strip_matrix_64.txt -TotalCount 1) -replace '.*rtti=', 'all-off rtti='
          $tail = (Get-Content strip_matrix_64.txt -Tail 1) -replace '.*rtti=', 'all-on rtti='
          @(
            "### Test detail - windows-msvc (${{ matrix.cfg }})",
            "",
            "| program | assertions | failures | result |",
            "| --- | --- | --- | --- |"
          ) + $rows + @(
            "",
            "Strip-matrix baselines (``strip_matrix_64.txt``): $head ... $tail",
            "",
            "<details><summary>Per-case assertion counts ($caseCount cases)</summary>",
            ""
          ) + $cases + @(
            "</details>"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows-msvc-${{ matrix.cfg }}
          path: test-logs/

  linux-gcc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cfg: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (GCC, -Werror)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.cfg }} -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test detail (per-case output + step summary)
        if: always()
        run: |
          set -u
          mkdir -p test-logs
          : > rows.md
          : > cases.md
          for exe in rtti_proto_extension_tests rtti_flat_schema_tests rtti_tests; do
            echo "================ build/tests/$exe ================"
            build/tests/$exe > "test-logs/$exe.log" 2>&1
            rc=$?
            cat "test-logs/$exe.log"
            a=$(grep -oE '[0-9]+ assertions' "test-logs/$exe.log" | tail -1 | grep -oE '[0-9]+' || true)
            f=$(grep -oE '[0-9]+ failures' "test-logs/$exe.log" | tail -1 | grep -oE '[0-9]+' || true)
            res=OK; [ "$rc" -eq 0 ] || res="exit $rc"
            printf '| %s | %s | %s | %s |\n' "$exe" "${a:-n/a}" "${f:-n/a}" "$res" >> rows.md
            {
              echo "#### $exe"
              echo ""
              echo "| case | assertions | failures |"
              echo "| --- | --- | --- |"
              sed -n 's/^\[CASE\] \(.*\): \([0-9]*\) assertions, \([0-9]*\) failures$/| \1 | \2 | \3 |/p' "test-logs/$exe.log"
              echo ""
            } >> cases.md
          done
          case_count=$(cat test-logs/*.log | grep -c '^\[CASE\] ' || true)
          head_line=$(head -1 strip_matrix_64.txt | sed 's/.*rtti=/all-off rtti=/')
          tail_line=$(tail -1 strip_matrix_64.txt | sed 's/.*rtti=/all-on rtti=/')
          {
            echo "### Test detail - linux-gcc (${{ matrix.cfg }})"
            echo ""
            echo "| program | assertions | failures | result |"
            echo "| --- | --- | --- | --- |"
            cat rows.md
            echo ""
            echo "Strip-matrix baselines (\`strip_matrix_64.txt\`): ${head_line} ... ${tail_line}"
            echo ""
            echo "<details><summary>Per-case assertion counts (${case_count} cases)</summary>"
            echo ""
            cat cases.md
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux-gcc-${{ matrix.cfg }}
          path: test-logs/

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Clang, -Werror)
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test detail (per-case output + step summary)
        if: always()
        run: |
          set -u
          mkdir -p test-logs
          : > rows.md
          : > cases.md
          for exe in rtti_proto_extension_tests rtti_flat_schema_tests rtti_tests; do
            echo "================ build/tests/$exe ================"
            build/tests/$exe > "test-logs/$exe.log" 2>&1
            rc=$?
            cat "test-logs/$exe.log"
            a=$(grep -oE '[0-9]+ assertions' "test-logs/$exe.log" | tail -1 | grep -oE '[0-9]+' || true)
            f=$(grep -oE '[0-9]+ failures' "test-logs/$exe.log" | tail -1 | grep -oE '[0-9]+' || true)
            res=OK; [ "$rc" -eq 0 ] || res="exit $rc"
            printf '| %s | %s | %s | %s |\n' "$exe" "${a:-n/a}" "${f:-n/a}" "$res" >> rows.md
            {
              echo "#### $exe"
              echo ""
              echo "| case | assertions | failures |"
              echo "| --- | --- | --- |"
              sed -n 's/^\[CASE\] \(.*\): \([0-9]*\) assertions, \([0-9]*\) failures$/| \1 | \2 | \3 |/p' "test-logs/$exe.log"
              echo ""
            } >> cases.md
          done
          case_count=$(cat test-logs/*.log | grep -c '^\[CASE\] ' || true)
          head_line=$(head -1 strip_matrix_64.txt | sed 's/.*rtti=/all-off rtti=/')
          tail_line=$(tail -1 strip_matrix_64.txt | sed 's/.*rtti=/all-on rtti=/')
          {
            echo "### Test detail - linux-clang (Debug)"
            echo ""
            echo "| program | assertions | failures | result |"
            echo "| --- | --- | --- | --- |"
            cat rows.md
            echo ""
            echo "Strip-matrix baselines (\`strip_matrix_64.txt\`): ${head_line} ... ${tail_line}"
            echo ""
            echo "<details><summary>Per-case assertion counts (${case_count} cases)</summary>"
            echo ""
            cat cases.md
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux-clang
          path: test-logs/

  linux-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan/UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test detail (per-case output + step summary)
        if: always()
        run: |
          set -u
          mkdir -p test-logs
          : > rows.md
          : > cases.md
          for exe in rtti_proto_extension_tests rtti_flat_schema_tests rtti_tests; do
            echo "================ build/tests/$exe ================"
            build/tests/$exe > "test-logs/$exe.log" 2>&1
            rc=$?
            cat "test-logs/$exe.log"
            a=$(grep -oE '[0-9]+ assertions' "test-logs/$exe.log" | tail -1 | grep -oE '[0-9]+' || true)
            f=$(grep -oE '[0-9]+ failures' "test-logs/$exe.log" | tail -1 | grep -oE '[0-9]+' || true)
            res=OK; [ "$rc" -eq 0 ] || res="exit $rc"
            printf '| %s | %s | %s | %s |\n' "$exe" "${a:-n/a}" "${f:-n/a}" "$res" >> rows.md
            {
              echo "#### $exe"
              echo ""
              echo "| case | assertions | failures |"
              echo "| --- | --- | --- |"
              sed -n 's/^\[CASE\] \(.*\): \([0-9]*\) assertions, \([0-9]*\) failures$/| \1 | \2 | \3 |/p' "test-logs/$exe.log"
              echo ""
            } >> cases.md
          done
          case_count=$(cat test-logs/*.log | grep -c '^\[CASE\] ' || true)
          head_line=$(head -1 strip_matrix_64.txt | sed 's/.*rtti=/all-off rtti=/')
          tail_line=$(tail -1 strip_matrix_64.txt | sed 's/.*rtti=/all-on rtti=/')
          {
            echo "### Test detail - linux-asan (Debug, ASan/UBSan)"
            echo ""
            echo "| program | assertions | failures | result |"
            echo "| --- | --- | --- | --- |"
            cat rows.md
            echo ""
            echo "Strip-matrix baselines (\`strip_matrix_64.txt\`): ${head_line} ... ${tail_line}"
            echo ""
            echo "<details><summary>Per-case assertion counts (${case_count} cases)</summary>"
            echo ""
            cat cases.md
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux-asan
          path: test-logs/

  benchmarks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC x64)
        run: cmake -S . -B build -A x64
      - name: Build benchmarks (Release)
        run: cmake --build build --config Release --target rtti_bench rtti_bench_new rtti_bench_parse
      - name: Run benchmarks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bench-logs | Out-Null
          foreach ($exe in @('rtti_bench_new', 'rtti_bench', 'rtti_bench_parse')) {
            Write-Host "================ $exe ================"
            $runArgs = @()
            # The recorded local captures ran rtti_bench_new with 20,000,000
            # iters/sample; rtti_bench (100000000/10000000/1000000) and
            # rtti_bench_parse (30) carry their iteration counts internally.
            if ($exe -eq 'rtti_bench_new') { $runArgs = @('20000000') }
            $out = & "build\bench\Release\$exe.exe" @runArgs 2>&1
            $rc = $LASTEXITCODE
            $out | Write-Host
            $out | Out-File -FilePath "bench-logs\$exe.txt" -Encoding utf8
            if ($rc -ne 0) { throw "$exe exited with $rc" }
          }
          $tables = (Get-Content bench-logs\*.txt) -join "`n"
          @(
            "### Benchmarks - windows-latest, MSVC Release (CI runner data point)",
            "",
            "Toolchain family and iteration parameters match the recorded local captures (``rtti_bench_new`` 20000000 iters/sample; ``rtti_bench`` built-in 100000000/10000000/1000000; ``rtti_bench_parse`` 30 iters). The runner CPU and the exact MSVC version differ, so compare shapes, not absolute values; the environment header above each table names the compiler actually used.",
            "",
            '```',
            $tables,
            '```'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs-windows-msvc-release
          path: bench-logs/

  # Cross-compiler link check: build the rtti static library with GCC, build
  # everything with Clang, then swap the GCC-built archive in and force a
  # relink of the test executables. An ODR-fragile inline (an out-of-line
  # static member or a typeinfo emitted into exactly one TU) breaks exactly
  # here, so this job is the ABI sanity net for mixed-toolchain consumers.
  # LTO stays off: GCC LTO objects cannot be linked by the Clang driver.
  linux-cross-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static library (GCC, no LTO)
        run: |
          cmake -S . -B build-gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release -DRTTI_ENABLE_LTO=OFF
          cmake --build build-gcc --target rtti -j
      - name: Build tests (Clang, -Werror)
        run: |
          cmake -S . -B build-xlink -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build build-xlink -j
      - name: Relink tests against the GCC-built library and run
        run: |
          cp build-gcc/librtti.a build-xlink/librtti.a
          rm -f build-xlink/tests/rtti_tests \
                build-xlink/tests/rtti_proto_extension_tests \
                build-xlink/tests/rtti_flat_schema_tests
          cmake --build build-xlink -j
          ctest --test-dir build-xlink --output-on-failure
      - name: Test detail (per-case output + step summary)
        if: always()
        run: |
          set -u
          mkdir -p test-logs
          : > rows.md
          : > cases.md
          for exe in rtti_proto_extension_tests rtti_flat_schema_tests rtti_tests; do
            echo "================ build-xlink/tests/$exe ================"
            build-xlink/tests/$exe > "test-logs/$exe.log" 2>&1
            rc=$?
            cat "test-logs/$exe.log"
            a=$(grep -oE '[0-9]+ assertions' "test-logs/$exe.log" | tail -1 | grep -oE '[0-9]+' || true)
            f=$(grep -oE '[0-9]+ failures' "test-logs/$exe.log" | tail -1 | grep -oE '[0-9]+' || true)
            res=OK; [ "$rc" -eq 0 ] || res="exit $rc"
            printf '| %s | %s | %s | %s |\n' "$exe" "${a:-n/a}" "${f:-n/a}" "$res" >> rows.md
            {
              echo "#### $exe"
              echo ""
              echo "| case | assertions | failures |"
              echo "| --- | --- | --- |"
              sed -n 's/^\[CASE\] \(.*\): \([0-9]*\) assertions, \([0-9]*\) failures$/| \1 | \2 | \3 |/p' "test-logs/$exe.log"
              echo ""
            } >> cases.md
          done
          case_count=$(cat test-logs/*.log | grep -c '^\[CASE\] ' || true)
          head_line=$(head -1 strip_matrix_64.txt | sed 's/.*rtti=/all-off rtti=/')
          tail_line=$(tail -1 strip_matrix_64.txt | sed 's/.*rtti=/all-on rtti=/')
          {
            echo "### Test detail - linux-cross-link (GCC lib + Clang tests)"
            echo ""
            echo "| program | assertions | failures | result |"
            echo "| --- | --- | --- | --- |"
            cat rows.md
            echo ""
            echo "Strip-matrix baselines (\`strip_matrix_64.txt\`): ${head_line} ... ${tail_line}"
            echo ""
            echo "<details><summary>Per-case assertion counts (${case_count} cases)</summary>"
            echo ""
            cat cases.md
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux-cross-link
          path: test-logs/
